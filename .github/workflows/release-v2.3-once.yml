name: One-shot v2.3 Release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-v2.3-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Create v2.3 Release
    runs-on: ubuntu-latest
    steps:
    - name: Download artifacts from verified main build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh run download 35015591168 --repo "${{ github.repository }}"

    - name: Verify release payload
      run: |
        test -f BZR_Texture_Manager_Windows/BZR_Texture_Manager_Windows.exe
        test -f BZR_Texture_Manager_Windows/BZR_MakeMAP_Compat_Windows.exe
        test -f BZR_Texture_Manager_Linux/BZR_Texture_Manager_Linux
        test -f BZR_Texture_Manager_Linux/BZR_MakeMAP_Compat_Linux
        test -f BZR_Texture_Manager_MacOS/BZR_Texture_Manager_MacOS
        test -f BZR_Texture_Manager_MacOS/BZR_MakeMAP_Compat_MacOS

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh release view v2.3 --repo "${{ github.repository }}" >/dev/null 2>&1; then
          echo "v2.3 already exists; nothing to do."
          exit 0
        fi

        gh release create v2.3 \
          BZR_Texture_Manager_Windows/BZR_Texture_Manager_Windows.exe \
          BZR_Texture_Manager_Windows/BZR_MakeMAP_Compat_Windows.exe \
          BZR_Texture_Manager_Linux/BZR_Texture_Manager_Linux \
          BZR_Texture_Manager_Linux/BZR_MakeMAP_Compat_Linux \
          BZR_Texture_Manager_MacOS/BZR_Texture_Manager_MacOS \
          BZR_Texture_Manager_MacOS/BZR_MakeMAP_Compat_MacOS \
          --repo "${{ github.repository }}" \
          --target "8651ab9c0bfffcbab736fcd7d42777f0cf0d59d9" \
          --title "v2.3" \
          --generate-notes
