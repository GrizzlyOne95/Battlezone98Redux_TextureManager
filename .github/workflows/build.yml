name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            binary_name: BZR_Texture_Manager_Windows
            artifact_name: BZR_Texture_Manager_Windows.exe
            makemap_binary_name: BZR_MakeMAP_Compat_Windows
            makemap_artifact_name: BZR_MakeMAP_Compat_Windows.exe
          - os: ubuntu-latest
            binary_name: BZR_Texture_Manager_Linux
            artifact_name: BZR_Texture_Manager_Linux
            makemap_binary_name: BZR_MakeMAP_Compat_Linux
            makemap_artifact_name: BZR_MakeMAP_Compat_Linux
          - os: macos-latest
            binary_name: BZR_Texture_Manager_MacOS
            artifact_name: BZR_Texture_Manager_MacOS
            makemap_binary_name: BZR_MakeMAP_Compat_MacOS
            makemap_artifact_name: BZR_MakeMAP_Compat_MacOS

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Run codec regression tests
      run: python -m unittest discover -s tests -v

    - name: Download texconv (Windows only)
      if: matrix.os == 'windows-latest'
      run: |
        curl -L -o texconv.exe https://github.com/microsoft/DirectXTex/releases/latest/download/texconv.exe

    - name: Build Texture Manager (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        python -m PyInstaller --noconfirm --onefile --windowed --name "${{ matrix.binary_name }}" --icon "bzrtex.ico" --add-data "bzrtex.ico;." --collect-all customtkinter --copy-metadata imageio src/tex_man_entry.py

    - name: Build Texture Manager (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        python -m PyInstaller --noconfirm --onefile --windowed --name "${{ matrix.binary_name }}" --icon "bzrtex.ico" --add-data "bzrtex.ico:." --collect-all customtkinter --copy-metadata imageio src/tex_man_entry.py

    - name: Build Texture Manager (MacOS)
      if: matrix.os == 'macos-latest'
      run: |
        python -m PyInstaller --noconfirm --onefile --windowed --name "${{ matrix.binary_name }}" --icon "bzrtex.ico" --add-data "bzrtex.ico:." --collect-all customtkinter --copy-metadata imageio src/tex_man_entry.py

    - name: Build MakeMAP compatibility utility
      run: |
        python -m PyInstaller --noconfirm --onefile --name "${{ matrix.makemap_binary_name }}" src/makemap_compat.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.binary_name }}
        path: |
          dist/${{ matrix.artifact_name }}
          dist/${{ matrix.makemap_artifact_name }}

  release:
    name: Create Release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: v2.1'
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.1
        name: v2.1
        target_commitish: fab43ed2f7b82e0ae008fb4f4b8fccc57f0ab509
        files: |
          BZR_Texture_Manager_Windows/BZR_Texture_Manager_Windows.exe
          BZR_Texture_Manager_Windows/BZR_MakeMAP_Compat_Windows.exe
          BZR_Texture_Manager_Linux/BZR_Texture_Manager_Linux
          BZR_Texture_Manager_Linux/BZR_MakeMAP_Compat_Linux
          BZR_Texture_Manager_MacOS/BZR_Texture_Manager_MacOS
          BZR_Texture_Manager_MacOS/BZR_MakeMAP_Compat_MacOS
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
